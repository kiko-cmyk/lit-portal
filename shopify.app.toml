# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "adfffb53532dfc0d31fc0b971e3f23a2"
application_url = "https://lit-portal-drab.vercel.app"
embedded = false
name = "LIT Portal"

[webhooks]
api_version = "2026-04"

[app_proxy]
url = "https://lit-portal-drab.vercel.app"
subpath = "portal"
prefix = "apps"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,write_customers,read_orders,read_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://lit-portal.vercel.app/api/auth/callback",
  "https://lit-portal-drab.vercel.app/api/auth/shopify/callback",
  # Customer Account API OAuth callback. Added 2026-05-20: clientes
  # logueados en tracking.litsalt.com rebotan directo aqui en lugar
  # de quedarse en el dashboard de Shopify. Aterrizan en /apps/portal/mi-lit.
  # Path lleva /api/ porque el route vive en src/app/api/auth/callback/route.ts
  "https://litsalt.com/apps/portal/api/auth/callback"
]
